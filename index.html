<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amir Mamin</title>

  <style>
    :root {
      --bg: #f5f5f1;
      --text: #111111;
      --muted: rgba(17, 17, 17, 0.42);
      --line: rgba(17, 17, 17, 0.08);
      --accent: #000;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: clamp(90px, 16vh, 180px);
    }

    .name {
      font-size: 14px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .nav a {
      transition: opacity 0.2s ease;
    }

    .nav a:hover {
      opacity: 0.35;
    }

    .intro {
      max-width: 640px;
      margin-bottom: clamp(100px, 18vh, 220px);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 110px);
      line-height: 0.88;
      font-weight: 500;
      letter-spacing: -0.06em;
    }

    .intro p {
      margin-top: 26px;
      max-width: 420px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--muted);
    }

    .projects {
      margin-top: auto;
      border-top: 1px solid var(--line);
    }

    .project {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      transition: opacity 0.25s ease;
    }

    .projects:hover .project {
      opacity: 0.28;
    }

    .projects .project:hover {
      opacity: 1;
    }

    .project-year,
    .project-meta {
      font-size: 13px;
      color: var(--muted);
    }

    .project-title {
      font-size: clamp(26px, 4vw, 54px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 500;
    }

    .footer {
      margin-top: 120px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .page {
        padding: 20px;
      }

      .top,
      .footer {
        flex-direction: column;
        gap: 12px;
      }

      .project {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 16px 0;
      }

      .project-meta {
        display: none;
      }

      .project-title {
        font-size: 36px;
      }

      .intro {
        margin-bottom: 100px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="top">
      <div class="name">Amir Mamin</div>

      <nav class="nav">
        <a href="mailto:hello@example.com">email</a>
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
          instagram
        </a>
      </nav>
    </header>

    <section class="intro">
      <h1>
        works<br />
        and archives
      </h1>

      <p>
        a multidisciplinary artist working across graphic media,
        photography and video.
      </p>
    </section>

    <section class="projects">

      <a
        class="project"
        href="wait-go/"
        data-preload-document="wait-go/"
        data-preload-video="wait-go/images2/Timeline 4.mp4"
      >
        <span class="project-year">2026</span>

        <span class="project-title">
          wait / go
        </span>

        <span class="project-meta">
          street camera archive
        </span>
      </a>

      <a
        class="project"
        href="concrete-tbilisi/"
        data-preload-document="concrete-tbilisi/"
        data-preload-images="concrete-tbilisi/images/01.png"
      >
        <span class="project-year">2025</span>

        <span class="project-title">
          concrete tbilisi
        </span>

        <span class="project-meta">
          photo / research
        </span>
      </a>

    </section>

    <footer class="footer">
      <div>Saint Petersburg / Stockholm</div>
      <div>© 2026</div>
    </footer>

  </main>

  <script>
    const warmed = new Set();

    function addPrefetch(href) {
      if (!href || warmed.has("document:" + href)) return;

      const link = document.createElement("link");
      link.rel = "prefetch";
      link.href = href;

      document.head.appendChild(link);
      warmed.add("document:" + href);
    }

    function preloadImage(src) {
      if (!src || warmed.has("image:" + src)) return;

      const img = new Image();
      img.decoding = "async";
      img.src = src;

      warmed.add("image:" + src);
    }

    function preloadVideo(src) {
      if (!src || warmed.has("video:" + src)) return;

      const link = document.createElement("link");
      link.rel = "preload";
      link.as = "video";
      link.href = src;
      link.type = "video/mp4";

      document.head.appendChild(link);

      const video = document.createElement("video");
      video.preload = "auto";
      video.muted = true;
      video.playsInline = true;
      video.src = src;
      video.style.display = "none";

      document.body.appendChild(video);
      video.load();

      warmed.add("video:" + src);
    }

    function warmProject(link) {
      addPrefetch(link.dataset.preloadDocument);
      preloadVideo(link.dataset.preloadVideo);

      if (link.dataset.preloadImages) {
        link.dataset.preloadImages
          .split(/\s+/)
          .filter(Boolean)
          .forEach(preloadImage);
      }
    }

    document.querySelectorAll(".project").forEach(link => {
      link.addEventListener("mouseenter", () => warmProject(link), { once: true });
      link.addEventListener("focus", () => warmProject(link), { once: true });
      link.addEventListener("pointerdown", () => warmProject(link), { once: true });
    });
  </script>
</body>
</html>
