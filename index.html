<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amir Mamin</title>

  <style>
    :root {
      --bg: #fff;
      --text: #111;
      --muted: rgba(17, 17, 17, 0.52);
      --line: rgba(17, 17, 17, 0.14);
      --accent: #ff2a1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: var(--accent);
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: clamp(16px, 1.8vw, 28px);
      position: relative;
    }

    .top {
      position: fixed;
      top: clamp(18px, 2vw, 30px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: min(460px, calc(100vw - 36px));
    }

    .name {
      font-weight: 400;
      letter-spacing: 0;
    }

    .bio {
      width: min(370px, 100%);
      margin: 8px auto 0;
      color: var(--muted);
      line-height: 1.3;
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 18px;
      color: var(--muted);
      margin-top: 12px;
    }

    .nav span {
      display: inline-block;
    }

    .projects {
      min-height: 100vh;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(4, auto);
      align-content: center;
      gap: clamp(24px, 5vw, 76px);
      width: min(760px, calc(100vw - 44px));
      margin: 0 auto;
      padding-top: clamp(116px, 17vh, 170px);
      padding-bottom: clamp(88px, 12vh, 140px);
    }

    .project {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      align-content: start;
      gap: 10px 18px;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .project:hover {
      color: var(--accent);
    }

    .project-index {
      color: var(--muted);
    }

    .project-title {
      font-size: 13px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
    }

    .project-preview {
      grid-column: 1 / -1;
      grid-row: 1;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      background:
        linear-gradient(135deg, rgba(17, 17, 17, 0.04), rgba(17, 17, 17, 0.01)),
        #f3f3f1;
      overflow: hidden;
    }

    .project-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      color: transparent;
      filter: grayscale(0.45) contrast(0.95);
      opacity: 0.92;
      transition: filter 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
    }

    .project:hover .project-preview img {
      filter: grayscale(0);
      opacity: 1;
      transform: scale(1.01);
    }

    .project.is-wait {
      grid-column: 2;
      grid-row: 2;
      order: 2;
    }

    .project.is-concrete {
      grid-column: 1;
      grid-row: 3;
      order: 3;
    }

    .project.is-end {
      grid-column: 1;
      grid-row: 1;
      order: 1;
    }

    .project.is-clouds {
      grid-column: 2;
      grid-row: 4;
      order: 4;
    }

    .footer {
      position: fixed;
      left: clamp(18px, 2vw, 32px);
      right: clamp(18px, 2vw, 32px);
      bottom: clamp(18px, 2vw, 32px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      color: var(--text);
      pointer-events: none;
    }

    .footer .footer-meta {
      grid-column: 1;
      color: var(--muted);
    }

    .footer .footer-year {
      grid-column: 2;
      justify-self: end;
      color: var(--muted);
    }

    @media (max-width: 680px) {
      .top {
        position: static;
        transform: none;
        text-align: left;
      }

      .nav {
        justify-content: flex-start;
      }

      .bio {
        max-width: 280px;
        margin-left: 0;
        margin-right: 0;
      }

      .projects {
        min-height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: none;
        width: 100%;
        gap: 28px;
        padding: 72px 0 120px;
      }

      .project.is-wait,
      .project.is-concrete,
      .project.is-end,
      .project.is-clouds {
        grid-column: auto;
        grid-row: auto;
      }

      .project {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 18px;
        padding: 0;
        border-top: 0;
      }

      .project-title {
        grid-column: 1;
        grid-row: 2;
      }

      .project-index {
        grid-column: 2;
        grid-row: 2;
      }

      .project-preview {
        grid-column: 1 / -1;
        width: 100%;
      }

      .footer {
        position: static;
        display: block;
        margin-top: 40px;
      }

      .footer .footer-meta,
      .footer .footer-year {
        display: block;
        text-align: left;
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="top">
      <div>
        <div class="name">Amir Mamin</div>
        <div class="bio">
          a multidisciplinary artist working across graphic media, photography and video
        </div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <span>about</span>
        <span>contact</span>
      </nav>
    </header>

    <section class="projects" id="projects" aria-label="Projects">
      <a
        class="project is-wait"
        href="wait-go/"
        data-preload-document="wait-go/"
        data-preload-video="wait-go/images2/Timeline 4.mp4"
      >
        <span class="project-title">wait / go</span>
        <span class="project-index">2025-26</span>
        <span class="project-preview" aria-hidden="true">
          <img src="wait-go/images2/2025-01-12_1.jpg" loading="lazy" decoding="async" alt="">
        </span>
      </a>

      <a
        class="project is-concrete"
        href="concrete-tbilisi/"
        data-preload-document="concrete-tbilisi/"
        data-preload-images="concrete-tbilisi/images/01.png"
      >
        <span class="project-title">concrete tbilisi</span>
        <span class="project-index">2025</span>
        <span class="project-preview" aria-hidden="true">
          <img src="concrete-tbilisi/images/01.png" loading="lazy" decoding="async" alt="">
        </span>
      </a>

      <a
        class="project is-end"
        href="the-end/"
        data-preload-document="the-end/"
        data-preload-images="the-end/00001.jpg the-end/00002.jpg"
      >
        <span class="project-title">what would you do if it was the end of the world?</span>
        <span class="project-index">2026-now</span>
        <span class="project-preview" aria-hidden="true">
          <img src="the-end/00001.jpg" loading="lazy" decoding="async" alt="">
        </span>
      </a>

      <a
        class="project is-clouds"
        href="above-the-clouds/"
        data-preload-document="above-the-clouds/"
        data-preload-images="above-the-clouds/1.jpg above-the-clouds/2.jpg"
      >
        <span class="project-title">above the clouds</span>
        <span class="project-index">2022</span>
        <span class="project-preview" aria-hidden="true">
          <img src="above-the-clouds/1.jpg" loading="lazy" decoding="async" alt="">
        </span>
      </a>

    </section>

    <footer class="footer">
      <div class="footer-meta">Saint Petersburg / Stockholm</div>
      <div class="footer-year">© 2026</div>
    </footer>
  </main>
  <script>
    const warmed = new Set();

    function addPrefetch(href) {
      if (!href || warmed.has("document:" + href)) return;

      const link = document.createElement("link");
      link.rel = "prefetch";
      link.href = href;
      document.head.appendChild(link);
      warmed.add("document:" + href);
    }

    function preloadImage(src) {
      if (!src || warmed.has("image:" + src)) return;

      const img = new Image();
      img.decoding = "async";
      img.src = src;
      warmed.add("image:" + src);
    }

    function preloadVideo(src) {
      if (!src || warmed.has("video:" + src)) return;

      const link = document.createElement("link");
      link.rel = "preload";
      link.as = "video";
      link.href = src;
      link.type = "video/mp4";
      document.head.appendChild(link);

      const video = document.createElement("video");
      video.preload = "auto";
      video.muted = true;
      video.playsInline = true;
      video.src = src;
      video.style.display = "none";
      document.body.appendChild(video);
      video.load();

      warmed.add("video:" + src);
    }

    function warmProject(link) {
      addPrefetch(link.dataset.preloadDocument);
      preloadVideo(link.dataset.preloadVideo);

      if (link.dataset.preloadImages) {
        link.dataset.preloadImages
          .split(/\s+/)
          .filter(Boolean)
          .forEach(preloadImage);
      }
    }

    document.querySelectorAll(".project").forEach(link => {
      link.addEventListener("mouseenter", () => warmProject(link), { once: true });
      link.addEventListener("focus", () => warmProject(link), { once: true });
      link.addEventListener("pointerdown", () => warmProject(link), { once: true });
    });
  </script>
</body>
</html>
