<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amir Mamin</title>

  <style>
    :root {
      --bg: #fff;
      --text: #132D77;
      --muted: rgba(17, 17, 17, 0.55);
      --line: rgba(17, 17, 17, 0.18);
      --accent: #ff2a1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.35;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: var(--accent);
    }

    .page {
      width: min(100%, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(20px, 3vw, 44px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(36px, 6vh, 80px);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }

    .name {
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .nav {
      display: flex;
      gap: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .intro {
      max-width: 780px;
      align-self: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5.5vw, 72px);
      line-height: 0.95;
      font-family: "Arial Black", Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .intro p {
      max-width: 560px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.5vw, 18px);
      line-height: 1.35;
    }

    .projects {
      border-top: 1px solid var(--line);
    }

    .project {
      display: grid;
      grid-template-columns: minmax(72px, 0.18fr) 1fr auto;
      gap: clamp(16px, 3vw, 40px);
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
      align-items: baseline;
    }

    .project-year,
    .project-meta {
      color: var(--muted);
      font-size: 14px;
    }

    .project-title {
      font-size: clamp(19px, 2.2vw, 28px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 14px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    @media (max-width: 680px) {
      .top,
      .footer {
        display: block;
      }

      .nav,
      .footer div + div {
        margin-top: 10px;
      }

      .project {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .project-meta {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="top">
      <div class="name">Amir Mamin</div>
      <nav class="nav" aria-label="Main navigation">
        <a href="mailto:hello@example.com">email</a>
        <a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">instagram</a>
      </nav>
    </header>

    <section class="intro" aria-label="Introduction">
      <h1>works<br>and observations</h1>
      <p>
        A small index of projects, images, archives, and things noticed over time.
      </p>
    </section>

    <section class="projects" aria-label="Projects">
      <a
        class="project"
        href="wait-go/"
        data-preload-document="wait-go/"
        data-preload-video="wait-go/images2/Timeline 4.mp4"
      >
        <span class="project-year">2026</span>
        <span class="project-title">wait / go</span>
        <span class="project-meta">street camera archive</span>
      </a>

      <a
        class="project"
        href="concrete-tbilisi/"
        data-preload-document="concrete-tbilisi/"
        data-preload-images="concrete-tbilisi/images/01.png concrete-tbilisi/images/background.png"
      >
        <span class="project-year">2025</span>
        <span class="project-title">concrete tbilisi</span>
        <span class="project-meta">photo / research</span>
      </a>

    </section>

    <footer class="footer">
      <div>Saint Petersburg / Stockholm</div>
      <div>© 2026</div>
    </footer>
  </main>
  <script>
    const warmed = new Set();

    function addPrefetch(href) {
      if (!href || warmed.has("document:" + href)) return;

      const link = document.createElement("link");
      link.rel = "prefetch";
      link.href = href;
      document.head.appendChild(link);
      warmed.add("document:" + href);
    }

    function preloadImage(src) {
      if (!src || warmed.has("image:" + src)) return;

      const img = new Image();
      img.decoding = "async";
      img.src = src;
      warmed.add("image:" + src);
    }

    function preloadVideo(src) {
      if (!src || warmed.has("video:" + src)) return;

      const link = document.createElement("link");
      link.rel = "preload";
      link.as = "video";
      link.href = src;
      link.type = "video/mp4";
      document.head.appendChild(link);

      const video = document.createElement("video");
      video.preload = "auto";
      video.muted = true;
      video.playsInline = true;
      video.src = src;
      video.style.display = "none";
      document.body.appendChild(video);
      video.load();

      warmed.add("video:" + src);
    }

    function warmProject(link) {
      addPrefetch(link.dataset.preloadDocument);
      preloadVideo(link.dataset.preloadVideo);

      if (link.dataset.preloadImages) {
        link.dataset.preloadImages
          .split(/\s+/)
          .filter(Boolean)
          .forEach(preloadImage);
      }
    }

    document.querySelectorAll(".project").forEach(link => {
      link.addEventListener("mouseenter", () => warmProject(link), { once: true });
      link.addEventListener("focus", () => warmProject(link), { once: true });
      link.addEventListener("pointerdown", () => warmProject(link), { once: true });
    });
  </script>
</body>
</html>
