<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>concrete tbilisi</title>

  <style>
    :root {
      --bg: #eeeeec;
      --text: #ff2a1f;
      --muted: #ff2a1f;
      --line: rgba(17, 17, 17, 0.16);
      --accent: #ff2a1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    button:hover {
      color: var(--accent);
    }

    button {
      color: inherit;
      border: 0;
      padding: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .site {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 40px);
      gap: 18px;
    }

    .top,
    .bottom {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      gap: 24px;
      font-size: clamp(12px, 1.2vw, 15px);
      line-height: 1;
      color: var(--muted);
      z-index: 20;
    }

    .title {
      color: var(--text);
      font-weight: 400;
      text-align: right;
      text-transform: uppercase;
    }

    .top > :last-child,
    .bottom > :last-child {
      justify-self: end;
    }

    .book {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spread {
      width: min(70vw, calc(70vh * 1786 / 1263));
      aspect-ratio: 1786 / 1263;
      height: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: center;
    }

    .page {
      position: relative;
      height: 100%;
      min-width: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page.left {
      justify-content: flex-end;
    }

    .page.right {
      justify-content: flex-start;
    }

    .spread.is-cover {
      grid-template-columns: 1fr 1fr;
    }

    .spread.is-cover .page.left {
      grid-column: 1 / -1;
      justify-content: center;
    }

    .spread.is-cover .page.left img {
      width: 50%;
      height: 100%;
    }

    .spread.is-cover .page.right {
      display: none;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .empty {
      max-width: 360px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 10;
    }

    .hit.prev {
      left: 0;
      cursor: w-resize;
    }

    .hit.next {
      right: 0;
      cursor: e-resize;
    }

    .controls {
      display: flex;
      gap: 16px;
      color: var(--text);
    }

    .counter {
      min-width: 72px;
      text-align: right;
      color: var(--text);
    }

    .meta {
      max-width: 520px;
    }

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .site {
        padding: 14px;
      }

      .spread {
        width: min(88vw, calc(70vh * 893 / 1263));
        aspect-ratio: 893 / 1263;
        height: auto;
        grid-template-columns: 1fr;
        gap: 0;
      }

      .page.left {
        justify-content: center;
      }

      .page.right {
        display: none;
      }

      .bottom {
        align-items: flex-end;
      }

      .meta {
        max-width: 220px;
      }
    }
  </style>
</head>

<body>
  <main class="site">
    <header class="top">
      <a href="../">back</a>
      <div></div>
      <div class="title">Concrete Tbilisi</div>
    </header>

    <section class="book" aria-label="Concrete Tbilisi photobook viewer">
      <button class="hit prev" id="prev" aria-label="Previous spread"></button>
      <div class="spread" id="spread">
        <figure class="page left">
          <img id="leftPage" alt="">
        </figure>
        <figure class="page right">
          <img id="rightPage" alt="">
        </figure>
      </div>
      <button class="hit next" id="next" aria-label="Next spread"></button>
    </section>

    <footer class="bottom">
      <div></div>
      <div></div>
      <div class="controls">
        <button id="prevText">prev</button>
        <button id="nextText">next</button>
        <div class="counter" id="counter">00 / 00</div>
      </div>
    </footer>
  </main>

  <script>
    const photos = [
      "images/01.png",

      "images/14.png",
      "images/15.png",
      "images/16.png",
      "images/17.png",
      "images/18.png",
      "images/19.png",
      "images/20.png",
      "images/21.png",
      "images/22.png",
      "images/23.png",
      "images/24.png",
      "images/25.png",
      "images/26.png",
      "images/27.png",
      "images/28.png",
      "images/29.png",
      "images/30.png",

      "images/40.png",

      "images/62.png",

      "images/64.png",
      "images/65.png",

      "images/74.png",
      "images/75.png",
      "images/76.png",
      "images/77.png",
      "images/78.png",
      "images/79.png",
      "images/80.png",
      "images/81.png",
      "images/82.png",
      "images/83.png",
      "images/84.png",
      "images/85.png",
      "images/86.png",
      "images/87.png",
      "images/88.png",
      "images/89.png",
      "images/90.png",
      "images/91.png",
      "images/92.png",
      "images/93.png",
      "images/94.png",
      "images/95.png",
      "images/96.png"
    ];

    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const counter = document.getElementById("counter");
    const spread = document.getElementById("spread");

    let index = 0;

    function isSinglePage() {
      return window.matchMedia("(max-width: 760px)").matches;
    }

    function clampIndex(value) {
      return Math.max(0, Math.min(photos.length - 1, value));
    }

    function updateBook() {
      if (!photos.length) {
        spread.innerHTML = '<div class="empty">Add photographs to the images folder and list them in the photos array.</div>';
        counter.textContent = "00 / 00";
        return;
      }

      index = clampIndex(index);

      if (isSinglePage()) {
        spread.classList.remove("is-cover");
        leftPage.src = photos[index];
        leftPage.alt = "Concrete Tbilisi photograph " + String(index + 1);
        rightPage.removeAttribute("src");
        counter.textContent = String(index + 1).padStart(2, "0") + " / " + String(photos.length).padStart(2, "0");
        preloadAround(index);
        return;
      }

      if (index === 0) {
        spread.classList.add("is-cover");
        leftPage.src = photos[0];
        leftPage.alt = "Concrete Tbilisi cover";
        rightPage.removeAttribute("src");
        rightPage.alt = "";
        counter.textContent = "01 / " + String(photos.length).padStart(2, "0");
        preloadAround(0);
        return;
      }

      spread.classList.remove("is-cover");

      const leftIndex = index % 2 === 1 ? index : index - 1;
      const rightIndex = leftIndex + 1;

      leftPage.src = photos[leftIndex];
      leftPage.alt = "Concrete Tbilisi photograph " + String(leftIndex + 1);

      if (photos[rightIndex]) {
        rightPage.src = photos[rightIndex];
        rightPage.alt = "Concrete Tbilisi photograph " + String(rightIndex + 1);
        rightPage.style.visibility = "visible";
      } else {
        rightPage.removeAttribute("src");
        rightPage.alt = "";
        rightPage.style.visibility = "hidden";
      }

      index = leftIndex;
      counter.textContent = String(leftIndex + 1).padStart(2, "0") + "-" + String(Math.min(rightIndex + 1, photos.length)).padStart(2, "0") + " / " + String(photos.length).padStart(2, "0");
      preloadAround(leftIndex);
    }

    function preloadAround(baseIndex) {
      for (let i = baseIndex - 2; i <= baseIndex + 4; i++) {
        if (!photos[i]) continue;
        const img = new Image();
        img.src = photos[i];
      }
    }

    function nextPage() {
      if (!isSinglePage() && index === 0) {
        index = 1;
      } else {
        index += isSinglePage() ? 1 : 2;
      }
      if (index >= photos.length) index = 0;
      updateBook();
    }

    function prevPage() {
      index -= isSinglePage() ? 1 : 2;
      if (!isSinglePage() && index < 1) {
        index = 0;
      } else if (index < 0) {
        index = photos.length - 1;
      }
      updateBook();
    }

    document.getElementById("next").onclick = nextPage;
    document.getElementById("prev").onclick = prevPage;
    document.getElementById("nextText").onclick = nextPage;
    document.getElementById("prevText").onclick = prevPage;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextPage();
      if (e.key === "ArrowLeft") prevPage();
    });

    let scrollAccumulator = 0;
    let isScrolling = false;
    const SCROLL_THRESHOLD = 80;

    window.addEventListener("wheel", (e) => {
      e.preventDefault();

      if (isScrolling) return;

      scrollAccumulator += e.deltaY;

      if (scrollAccumulator > SCROLL_THRESHOLD) {
        nextPage();
        lockScroll();
      } else if (scrollAccumulator < -SCROLL_THRESHOLD) {
        prevPage();
        lockScroll();
      }
    }, { passive: false });

    function lockScroll() {
      isScrolling = true;
      scrollAccumulator = 0;

      setTimeout(() => {
        isScrolling = false;
      }, 260);
    }

    window.addEventListener("resize", updateBook);
    updateBook();
  </script>
</body>
</html>
