<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>concrete tbilisi</title>

  <style>
    :root {
      --bg: #566368;
      --text: #ff2a1f;
      --muted: #ff2a1f;
      --line: rgba(17, 17, 17, 0.16);
      --accent: #ff2a1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -44px;
      background:
        linear-gradient(rgba(0, 0, 0, 0.20), rgba(0, 0, 0, 0.20)),
        url("images/background.png") center / cover no-repeat;
      filter: blur(6px);
      transform: scale(1.05);
      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    button:hover {
      color: var(--accent);
    }

    button {
      color: inherit;
      border: 0;
      padding: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .site {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 40px);
      gap: 18px;
    }

    .top,
    .bottom {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      gap: 24px;
      font-size: clamp(12px, 1.2vw, 15px);
      line-height: 1;
      color: var(--muted);
      z-index: 20;
    }

    .title {
      color: var(--text);
      font-weight: 400;
      text-align: right;
    }

    .top > :last-child,
    .bottom > :last-child {
      justify-self: end;
    }

    .book {
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .spread {
      position: relative;
      transition: transform 0.35s ease;
      z-index: 2;
      width: min(86vw, calc(78vh * 1786 / 1263));
      aspect-ratio: 1786 / 1263;
      height: auto;
      display: grid;
      --progress: 0; /* 0 → начало, 1 → конец */
      grid-template-columns: 1fr 1fr;
      gap: 0;
      align-items: center;
      background: #f2f2f0;
      border-radius: 2px 3px 4px 2px;
      box-shadow:
        -10px 4px 18px rgba(0, 0, 0, 0.18),
        12px 8px 24px rgba(0, 0, 0, 0.16),
        0 2px 2px rgba(255, 255, 255, 0.12),
        0 28px 80px rgba(0, 0, 0, 0.85);
      overflow: visible;
      transform:
        perspective(1600px)
        rotateX(0.7deg)
        rotateY(-0.35deg);
      transform-origin: center center;
    }

    .spread::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      background:
        radial-gradient(
          ellipse 90px 78% at 49.4% 46%,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.10) 34%,
          rgba(0, 0, 0, 0.04) 66%,
          rgba(0, 0, 0, 0) 100%
        ),
        radial-gradient(
          ellipse 58px 66% at 50.3% 58%,
          rgba(255, 255, 255, 0.16) 0%,
          rgba(255, 255, 255, 0.08) 44%,
          rgba(255, 255, 255, 0) 100%
        ),
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0) 43.8%,
          rgba(0, 0, 0, 0.08) 48.5%,
          rgba(0, 0, 0, 0.035) 49.8%,
          rgba(0, 0, 0, 0) 51.4%,
          rgba(0, 0, 0, 0) 100%
        ),
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(0, 0, 0, 0) 18%,
          rgba(0, 0, 0, 0.05) 52%,
          rgba(255, 255, 255, 0.05) 100%
        );
      mix-blend-mode: multiply;
      opacity: 0.95;
    }

    .spread::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.18);
      pointer-events: none;
      z-index: 5;
    }

    .page-stack {
      position: absolute;
      top: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 0;
      transition: width 0.25s ease;
      background:
        linear-gradient(
          to right,
          #f4f4ef 0 2px,
          #e7e7e1 2px 4px,
          #f1f1ec 4px 6px,
          #ddddd6 6px 8px,
          #eeeee8 8px 10px,
          #cfcfc7 10px 12px
        );
    }

    .page-stack.left-stack {
      width: calc(24px * var(--progress));
      right: 100%;
      clip-path: polygon(
        100% 0,
        100% 100%,
        0 calc(100% - 4px),
        0 4px
      );
      box-shadow: -10px 0 18px rgba(0, 0, 0, 0.24);
    }

    .page-stack.right-stack {
      width: calc(24px * (1 - var(--progress)));
      left: 100%;
      clip-path: polygon(
        0 0,
        100% 4px,
        100% calc(100% - 4px),
        0 100%
      );
      box-shadow: 10px 0 18px rgba(0, 0, 0, 0.24);
    }

    .page {
      position: relative;
      height: 100%;
      min-width: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2f0;
      overflow: hidden;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    .page.left::before {
      background:
        linear-gradient(to bottom, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0) 16%),
        linear-gradient(to right, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0) 8%);
    }

    .page.right::before {
      background:
        linear-gradient(to bottom, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 18%),
        linear-gradient(to left, rgba(0, 0, 0, 0.045), rgba(0, 0, 0, 0) 8%);
    }

    .page.left {
      justify-content: flex-end;
    }

    .page.right {
      justify-content: flex-start;
    }

    .spread.is-cover {
      grid-template-columns: 1fr 1fr;
      background: transparent;
      clip-path: none;
      box-shadow: none;
    }

    .spread.is-cover::before,
    .spread.is-cover::after {
      display: none;
    }

    .spread.is-cover .page.left {
      grid-column: 1;
      justify-content: flex-end;
      background: transparent;
    }

    .spread.is-cover .page.left img {
      width: 100%;
      height: 100%;
      transform: none;
    }

    .spread.is-cover .page.right {
      display: none;
    }

    .spread.is-cover .page::before {
      display: none;
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .page.left img {
      transform: perspective(1200px) rotateY(0.35deg);
      transform-origin: right center;
    }

    .page.right img {
      transform: perspective(1200px) rotateY(-0.25deg);
      transform-origin: left center;
    }

    .empty {
      max-width: 360px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
    }

    .hit {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 10;
    }

    .hit.prev {
      left: 0;
      cursor: w-resize;
    }

    .hit.next {
      right: 0;
      cursor: e-resize;
    }

    .controls {
      display: flex;
      gap: 16px;
      color: var(--text);
    }

    .counter {
      min-width: 72px;
      text-align: right;
      color: var(--text);
    }

    .meta {
      max-width: 520px;
    }

    @media (max-width: 360px) {
      body {
        overflow: hidden;
      }

      .page-stack {
        display: none;
      }

      .site {
        padding: 14px;
      }

      .spread {
        width: min(88vw, calc(72vh * 893 / 1263));
        aspect-ratio: 893 / 1263;
        height: auto;
        grid-template-columns: 1fr;
        gap: 0;
      }

      .spread::before,
      .spread::after {
        display: none;
      }

      .page.left {
        justify-content: center;
      }

      .page.right {
        display: none;
      }

      .bottom {
        align-items: flex-end;
      }

      .meta {
        max-width: 220px;
      }
    }
    /* FRONT COVER — показываем только правую "бумагу" */
    .spread.is-front-cover .left-stack {
      display: none;
    }
    
    .spread.is-front-cover .right-stack {
      display: block;
    }
    
    /* BACK COVER — показываем только левую */
    .spread.is-back-cover .right-stack {
      display: none;
    }
    
    .spread.is-back-cover .left-stack {
      display: block;
    }
    
    /* FRONT COVER — сдвигаем толщину к центру */
    .spread.is-front-cover .right-stack {
      left: 50%;
      transform: translateX(0);
    }

    .spread.is-front-cover {
      transform: translateX(25%);
      --progress: 0;
    }
    
    /* BACK COVER — книга слева */
    .spread.is-back-cover {
      transform: translateX(-25%);
      --progress: 1;
    }
    
  </style>
</head>

<body>
  <main class="site">
    <header class="top">
      <a href="../">back</a>
      <div></div>
      <div class="title">concrete tbilisi</div>
    </header>

    <section class="book" aria-label="Concrete Tbilisi photobook viewer">
      <button class="hit prev" id="prev" aria-label="Previous spread"></button>
      <div class="spread" id="spread">
        <div class="page-stack left-stack" aria-hidden="true"></div>
        <div class="page-stack right-stack" aria-hidden="true"></div>
        <figure class="page left">
          <img id="leftPage" alt="">
        </figure>
        <figure class="page right">
          <img id="rightPage" alt="">
        </figure>
      </div>
      <button class="hit next" id="next" aria-label="Next spread"></button>
    </section>

    <footer class="bottom">
      <div></div>
      <div></div>
      <div class="controls">
        <button id="prevText">prev</button>
        <button id="nextText">next</button>
        <div class="counter" id="counter">00 / 00</div>
      </div>
    </footer>
  </main>

  <script>
    const photos = [
      "images/01.png",
      "images/02.png",
      "images/03.png",
      "images/04.png",
      "images/05.png",
      "images/06.png",
      "images/07.png",
      "images/08.png",
      "images/09.png",
      "images/10.png",
      "images/11.png",
      "images/12.png",
      "images/13.png",
      "images/14.png",
      "images/15.png",
      "images/16.png",
      "images/17.png",
      "images/18.png",
      "images/19.png",
      "images/20.png",
      "images/21.png",
      "images/22.png",
      "images/23.png",
      "images/24.png",
      "images/25.png",
      "images/26.png",
      "images/27.png",
      "images/28.png",
      "images/29.png",
      "images/30.png",
      "images/31.png",
      "images/32.png",
      "images/33.png",
      "images/34.png",
      "images/35.png",
      "images/36.png",
      "images/37.png",
      "images/38.png",
      "images/39.png",
      "images/40.png",
      "images/41.png",
      "images/42.png",
      "images/43.png",
      "images/44.png",
      "images/45.png",
      "images/46.png",
      "images/47.png",
      "images/48.png",
      "images/49.png",
      "images/50.png",
      "images/51.png",
      "images/52.png",
      "images/53.png",
      "images/54.png",
      "images/55.png",
      "images/56.png",
      "images/57.png",
      "images/58.png",
      "images/59.png",
      "images/60.png",
      "images/61.png",
      "images/62.png",
      "images/63.png",
      "images/64.png",
      "images/65.png",
      "images/66.png",
      "images/67.png",
      "images/68.png",
      "images/69.png",
      "images/70.png",
      "images/71.png",
      "images/72.png",
      "images/73.png",
      "images/74.png",
      "images/75.png",
      "images/76.png",
      "images/77.png",
      "images/78.png",
      "images/79.png",
      "images/80.png",
      "images/81.png",
      "images/82.png",
      "images/83.png",
      "images/84.png",
      "images/85.png",
      "images/86.png",
      "images/87.png",
      "images/88.png",
      "images/89.png",
      "images/90.png",
      "images/91.png",
      "images/92.png",
      "images/93.png",
      "images/94.png",
      "images/95.png",
      "images/96.png"
    ];

    const leftPage = document.getElementById("leftPage");
    const rightPage = document.getElementById("rightPage");
    const counter = document.getElementById("counter");
    const spread = document.getElementById("spread");

    let index = 0;
    const preloadedPhotos = new Set();

    function isSinglePage() {
      return window.matchMedia("(max-width: 360px)").matches;
    }

    function clampIndex(value) {
      return Math.max(0, Math.min(photos.length - 1, value));
    }

    function updateBook() {
      const progress = index / (photos.length - 1);
      spread.style.setProperty("--progress", progress);
      
      if (!photos.length) {
        spread.innerHTML = '<div class="empty">Add photographs to the images folder and list them in the photos array.</div>';
        counter.textContent = "00 / 00";
        return;
      }

      index = clampIndex(index);

      if (isSinglePage()) {
        spread.classList.remove("is-cover");
        leftPage.src = photos[index];
        leftPage.alt = "Concrete Tbilisi photograph " + String(index + 1);
        rightPage.removeAttribute("src");
        counter.textContent = String(index + 1).padStart(2, "0") + " / " + String(photos.length).padStart(2, "0");
        preloadAround(index);
        return;
      }

      if (index === 0) {
        spread.classList.remove("is-back-cover");
        spread.classList.add("is-cover", "is-front-cover");
      
        leftPage.src = photos[index];
        leftPage.alt = "Concrete Tbilisi cover";
      
        rightPage.removeAttribute("src");
        rightPage.alt = "";
      
        counter.textContent =
          String(index + 1).padStart(2, "0") +
          " / " +
          String(photos.length).padStart(2, "0");
      
        preloadAround(index);
        return;
      }
      
      if (index === photos.length - 1) {
        spread.classList.remove("is-front-cover");
        spread.classList.add("is-cover", "is-back-cover");
      
        leftPage.src = photos[index];
        leftPage.alt = "Concrete Tbilisi back cover";
      
        rightPage.removeAttribute("src");
        rightPage.alt = "";
      
        counter.textContent =
          String(index + 1).padStart(2, "0") +
          " / " +
          String(photos.length).padStart(2, "0");
      
        preloadAround(index);
        return;
      }

      spread.classList.remove("is-cover", "is-front-cover", "is-back-cover");

      const leftIndex = index % 2 === 1 ? index : index - 1;
      const rightIndex = leftIndex + 1;

      leftPage.src = photos[leftIndex];
      leftPage.alt = "Concrete Tbilisi photograph " + String(leftIndex + 1);

      if (photos[rightIndex]) {
        rightPage.src = photos[rightIndex];
        rightPage.alt = "Concrete Tbilisi photograph " + String(rightIndex + 1);
        rightPage.style.visibility = "visible";
      } else {
        rightPage.removeAttribute("src");
        rightPage.alt = "";
        rightPage.style.visibility = "hidden";
      }

      index = leftIndex;
      counter.textContent = String(leftIndex + 1).padStart(2, "0") + "-" + String(Math.min(rightIndex + 1, photos.length)).padStart(2, "0") + " / " + String(photos.length).padStart(2, "0");
      preloadAround(leftIndex);
    }

    function preloadAround(baseIndex) {
      const preloadRange = 8;

      for (let i = baseIndex - preloadRange; i <= baseIndex + preloadRange; i++) {
        const photoIndex = (i + photos.length) % photos.length;
        const src = photos[photoIndex];

        if (!src || preloadedPhotos.has(src)) continue;

        const img = new Image();
        img.decoding = "async";
        img.src = src;
        preloadedPhotos.add(src);
      }
    }

    function nextPage() {
      if (!isSinglePage() && index === 0) {
        index = 1;
      } else {
        index += isSinglePage() ? 1 : 2;
      }
      if (index >= photos.length) index = 0;
      updateBook();
    }

    function prevPage() {
      if (!isSinglePage() && index === 1) {
        index = 0;
      } else {
        index -= isSinglePage() ? 1 : 2;
        if (index < 0) {
          index = photos.length - 1;
        }
      }
      updateBook();
    }

    document.getElementById("next").onclick = nextPage;
    document.getElementById("prev").onclick = prevPage;
    document.getElementById("nextText").onclick = nextPage;
    document.getElementById("prevText").onclick = prevPage;

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextPage();
      if (e.key === "ArrowLeft") prevPage();
    });

    let scrollAccumulator = 0;
    let isScrolling = false;
    const SCROLL_THRESHOLD = 80;

    window.addEventListener("wheel", (e) => {
      e.preventDefault();

      if (isScrolling) return;

      scrollAccumulator += e.deltaY;

      if (scrollAccumulator > SCROLL_THRESHOLD) {
        nextPage();
        lockScroll();
      } else if (scrollAccumulator < -SCROLL_THRESHOLD) {
        prevPage();
        lockScroll();
      }
    }, { passive: false });

    function lockScroll() {
      isScrolling = true;
      scrollAccumulator = 0;

      setTimeout(() => {
        isScrolling = false;
      }, 260);
    }

    window.addEventListener("resize", updateBook);
    updateBook();
  </script>
</body>
</html>
